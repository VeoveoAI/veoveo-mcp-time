[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-time"
publish = false

[workspace.dependencies]
# veoveo-core, pinned to one revision for every core crate.
veoveo-oauth-client = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "f685fbfd3d28a477d35f77cee3feacc8787772ac" }
veoveo-platform-store = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "f685fbfd3d28a477d35f77cee3feacc8787772ac" }
veoveo-task-runtime = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "f685fbfd3d28a477d35f77cee3feacc8787772ac" }
veoveo-test-fixtures = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "f685fbfd3d28a477d35f77cee3feacc8787772ac" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "f685fbfd3d28a477d35f77cee3feacc8787772ac" }
# veoveo-sdk-rust, pinned to one revision for the SDK library and its test fixture.
veoveo-sdk-rust = { git = "https://github.com/VeoveoAI/veoveo-sdk-rust", rev = "c9742c0b624c55e47f0d336cc7fd200676226304", default-features = false }
veoveo-sdk-rust-fixture = { git = "https://github.com/VeoveoAI/veoveo-sdk-rust", rev = "c9742c0b624c55e47f0d336cc7fd200676226304" }

anyhow = "=1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
flate2 = "1.1.9"
futures = "0.3.34"
iri-string = { version = "=0.7.14", default-features = false, features = ["std"] }
hex = "=0.4.3"
hifitime = { version = "4.3.1", default-features = false, features = ["std"] }
jsonschema = "=0.51.0"
jiff = { version = "0.2.35", features = ["tz-system"] }
rangemap = "1.8.0"
reqwest = { version = "=0.13.5", default-features = false }
rmcp = { version = "=3.5.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "917e7914c93975fc1eddbff8792f1e2de933bc17" }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
secrecy = "0.10.3"
sha2 = "=0.11.0"
# PostgreSQL 18 through the same sqlx release and features as veoveo-core. `sqlx-toml`
# reads the crate's migration table from its `sqlx.toml`.
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "json", "migrate", "macros", "sqlx-toml"] }
tokio = "1.53.1"
tokio-util = "0.7.19"
thiserror = "=2.0.21"
tar = "0.4.46"
tempfile = "=3.27.0"
tracing = "0.1.44"
url = "=2.5.8"
uuid = { version = "1.24.1", features = ["serde", "v4", "v5", "v7"] }
