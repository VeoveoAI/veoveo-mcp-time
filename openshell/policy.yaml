# OpenShell 0.1.3 policy for this component's development environment.
# The environment installs toolchains, components and crates, and fetches from GitHub.
# Pushing stays unauthorized: no GitHub credential enters the sandbox, and only
# git-upload-pack (fetch) is allowed.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/tmp, /dev/null, /usr/local/rustup, /usr/local/cargo]
network_policies:
  rust_toolchains:
    endpoints:
      - host: static.rust-lang.org
        port: 443
    binaries:
      - path: /usr/local/cargo/bin/*
  crates_io:
    endpoints:
      - host: index.crates.io
        port: 443
      - host: static.crates.io
        port: 443
      - host: crates.io
        port: 443
    binaries:
      - path: /usr/local/cargo/bin/*
      - path: /usr/local/rustup/toolchains/*/bin/cargo
  github_fetch:
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**/info/refs*"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
    binaries:
      - path: /usr/bin/git
      - path: /usr/lib/git-core/*
      - path: /usr/local/cargo/bin/*
      - path: /usr/local/rustup/toolchains/*/bin/cargo
  # Local installation. OpenShell pins each policy-listed executable path to the
  # SHA-256 it first observes and denies the path after the file changes, so Time runs
  # from a content-addressed copy under /sandbox/run, and acceptance tests run from a
  # fresh nextest archive extraction under /sandbox/run. Time registers with the Gateway
  # through its forward, where OpenShell substitutes the registration secret.
  local_gateway:
    endpoints:
      - host: host.openshell.internal
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
        credential_binding:
          provider: vv-registration
    binaries:
      - path: /sandbox/run/veoveo-mcp-time-*
      - path: /sandbox/run/acceptance-*/**
  # The installation's PostgreSQL server, which the registration's database grant names.
  local_database:
    endpoints:
      - host: host.openshell.internal
        port: 5432
        protocol: tcp
    binaries:
      - path: /sandbox/run/veoveo-mcp-time-*
