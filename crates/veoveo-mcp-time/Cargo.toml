[package]
name = "veoveo-mcp-time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_mcp_time"
path = "src/lib.rs"

[[bin]]
name = "veoveo-mcp-time"
path = "src/bin/server.rs"
required-features = ["mcp"]

[[test]]
name = "contract"
required-features = ["contract"]

[[test]]
name = "resource_contract"
required-features = ["contract"]

[[test]]
name = "numeric_contract"
required-features = ["contract"]

[[test]]
name = "digest_contract"
required-features = ["contract"]

[[test]]
name = "metadata_versions"
required-features = ["contract"]

[[test]]
name = "instant_contract"
required-features = ["contract"]

[[test]]
name = "authority_contract"
required-features = ["contract"]

[[test]]
name = "window_contract"
required-features = ["contract"]

[[test]]
name = "acceptance"
required-features = ["mcp"]

[features]
default = ["mcp"]
contract = [
    "dep:anyhow",
    "dep:jiff",
    "dep:url",
    "dep:uuid",
    "dep:thiserror",
    "dep:chrono",
    "dep:hex",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:veoveo-types",
    "dep:veoveo-sdk-rust",
]
runtime = [
    "contract",
    "chrono/clock",
    "dep:anyhow",
    "dep:futures",
    "dep:flate2",
    "dep:hifitime",
    "dep:jiff",
    "dep:rangemap",
    "dep:reqwest",
    "dep:rustls",
    "dep:sha2",
    "dep:tar",
    "dep:tokio",
    "dep:tokio-util",
    "dep:thiserror",
    "dep:sqlx",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
    "veoveo-sdk-rust/server",
    "dep:veoveo-store",
    "dep:veoveo-task",
]
mcp = [
    "runtime",
    "dep:axum",
    "dep:clap",
    "dep:dotenvy",
    "dep:rmcp",
    "dep:secrecy",
]

[dependencies]
veoveo-sdk-rust = { workspace = true, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
# Match the workspace Chrono pin; contract consumers only need its date/time wire types.
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"], optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
hifitime = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
rangemap = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, features = ["chrono04"], optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-store = { workspace = true, optional = true }
veoveo-task = { workspace = true, optional = true }

[dev-dependencies]
veoveo-fixtures = { workspace = true, features = ["store", "database-conformance"] }
veoveo-sdk-rust = { workspace = true, features = ["server", "testing", "client-credentials"] }
veoveo-sdk-rust-fixture.workspace = true
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
iri-string.workspace = true
serde_json.workspace = true
tempfile.workspace = true
